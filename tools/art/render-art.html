<!doctype html>
<html><head><meta charset="utf-8"><title>AI Orbit art renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
/* Procedural abstract artwork for AI Orbit · MockB.
   Palette: Evoke Primary #3D1766, Secondary #6F1AB6, Accent #FF0032 on ink #0D0716.
   render(mode, seed, w, h) → PNG data URL. Driven by tools/art/render_art.js */
const FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uMode; uniform float uSeed;
out vec4 o;
const vec3 INK=vec3(0.051,0.027,0.086), PRI=vec3(0.239,0.090,0.400), SEC=vec3(0.435,0.102,0.714), ACC=vec3(1.0,0.0,0.196), PINK=vec3(1.0,0.78,0.86), LAV=vec3(0.78,0.66,1.0);
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32+uSeed); return fract(p.x*p.y); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<6;i++){ v+=a*n2(p); p=m*p; a*=.5; } return v; }
float stars(vec2 uv, float dens){ vec2 g=uv*dens; vec2 i=floor(g); float r=h21(i); vec2 c=fract(g)-.5-(vec2(h21(i+7.),h21(i+3.))-.5)*.7; float d=length(c); return step(.985,r)*smoothstep(.06,0.,d)*(.4+.6*h21(i+1.)); }
vec3 grade(vec3 c, vec2 uv){ float v=1.-.55*pow(length((uv-.5)*vec2(1.1,1.25)),2.2); c*=v; c+= (h21(uv*uRes+uSeed)-.5)*.035; return pow(max(c,0.),vec3(.95)); }

vec3 planet(vec2 uv, vec2 p){
  vec3 c=INK*0.55; c+=stars(uv*vec2(uRes.x/uRes.y,1.),150.)*vec3(.85,.8,1.)*.8;
  vec2 pc=vec2(0.,-1.66); float R=1.42; float d=length(p-pc)-R;
  c+=PRI*.22*fbm(p*1.1+uSeed)*smoothstep(.6,-.8,p.y);
  float ang=atan(p.x-pc.x,p.y-pc.y);
  vec3 atm=mix(SEC*1.25,ACC*.95,smoothstep(-.45,.55,ang));
  float limb=exp(-abs(d)*90.)*.95 + exp(-max(d,0.)*14.)*.42;
  if(d<0.){ vec2 s=(p-pc)/R; float sh=fbm(s*5.+uSeed)*.5+fbm(s*19.)*.2;
    vec3 surf=mix(INK*.35,PRI*.32,sh);
    surf+=atm*pow(smoothstep(-.12,0.,d),2.)*.22;
    vec2 g=fract(s*vec2(260.,260.))-.5; float dots=step(.975,h21(floor(s*260.)))*smoothstep(.22,0.,length(g))*smoothstep(-.4,-.02,d);
    surf+=LAV*dots*.18; c=surf; }
  c+=atm*limb;
  for(int k=0;k<2;k++){ float fk=float(k); float rr=1.95+fk*.5; vec2 q=p-vec2(0.,-1.0); q.y*=3.4-fk*.5; float od=abs(length(q)-rr); c+=mix(LAV,ACC,fk)*exp(-od*420.)*.22*smoothstep(-.3,.5,p.y+.5); }
  return c;
}
vec3 ribbons(vec2 uv, vec2 p){
  vec3 c=INK; float w=(n2(p*.9+uSeed)+n2(p*.45-uSeed))*.9; vec3 acc=vec3(0.);
  for(int i=0;i<44;i++){ float fi=float(i); float y=-.9+fi*.045+sin(p.x*1.4+w*1.6+fi*.10+uSeed)*.30+(n2(vec2(p.x*.9+fi*.04,uSeed))-.5)*.35;
    float d=abs(p.y-y); float line=exp(-d*(380.-fi*4.)); vec3 col=mix(SEC,ACC,smoothstep(-.6,.9,p.x+sin(fi*.4)*.3)); col=mix(col,LAV,fi/60.); acc+=col*line*(.25+.75*smoothstep(1.4,0.,abs(p.x-sin(fi)*.3))); }
  c+=acc*.9; c+=PRI*.35*fbm(p*2.-uSeed); return c;
}
vec3 lattice(vec2 uv, vec2 p){
  vec3 c=INK*.8; float hor=.16; c+=mix(PRI,SEC,.5)*exp(-abs(p.y-hor)*6.)*.28;
  c+=stars(uv*vec2(uRes.x/uRes.y,1.),130.)*step(hor+.02,p.y)*.7;
  // perspective dot field over a soft fbm terrain
  for(int row=0; row<70; row++){
    float fr=float(row); float z=.6+fr*.09; float yb=hor-.9/z;          // base screen y of this row
    float xs=p.x*z*2.2; float cell=floor(xs*6.)/6.; float fx=fract(xs*6.)-.5;
    float hgt=fbm(vec2(cell*1.3+uSeed, z*.8))*.9 + .25*sin(cell*2.+z);
    float y=yb+hgt*.55/z; float dy=(p.y-y)*z*90.;
    float dotv=exp(-(fx*fx*40.+dy*dy)*1.2); float fade=smoothstep(7.,1.,z)*smoothstep(.0,.5,z-.5);
    vec3 col=mix(LAV,SEC,smoothstep(.3,.9,hgt)); col=mix(col,ACC,step(.965,h21(vec2(cell,fr))));
    c+=col*dotv*fade*.55;
  }
  return c;
}
vec3 rings(vec2 uv, vec2 p){
  vec3 c=INK; vec2 q=p-vec2(.25,0.); float r=length(q); float a=atan(q.y,q.x);
  for(int i=0;i<9;i++){ float fi=float(i); float rr=.18+fi*.11; float gap=step(.18, fract(a/6.2831*(2.+mod(fi,3.))+h21(vec2(fi,uSeed)))); float d=abs(r-rr); vec3 col=mix(LAV,SEC,fi/9.); if(i==3||i==7) col=ACC; c+=col*exp(-d*(420.-fi*25.))*gap*.8; c+=col*exp(-d*30.)*.04; }
  c+=mix(PRI,SEC,.5)*exp(-r*2.6)*.8; c+=PINK*exp(-r*18.)*.9; c+=PRI*.4*fbm(p*2.4+uSeed);
  return c;
}
vec3 nebula(vec2 uv, vec2 p){
  vec2 q=vec2(fbm(p*1.2+uSeed),fbm(p*1.2+3.1-uSeed)); vec2 r=vec2(fbm(p*1.6+q*2.4+1.7),fbm(p*1.6+q*2.4+9.2));
  float f=fbm(p*1.4+r*2.2); f=pow(f,1.6)*1.5; vec3 c=mix(INK*.6,PRI,smoothstep(.2,.7,f)); c=mix(c,SEC,smoothstep(.45,.85,f)*.9); c=mix(c,ACC,smoothstep(.62,.95,r.x*f*1.6)*.7); c+=PINK*pow(smoothstep(.7,1.,f),3.)*.4;
  c+=stars(uv*vec2(uRes.x/uRes.y,1.),160.)*.9; vec2 q2=p-vec2(-.2,-.1); q2.y*=2.6; c+=LAV*exp(-abs(length(q2)-.95)*380.)*.35; return c;
}
void main(){ vec2 uv=gl_FragCoord.xy/uRes; vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y; int m=int(uMode+.5); vec3 c;
  if(m==0) c=planet(uv,p); else if(m==1) c=ribbons(uv,p); else if(m==2) c=lattice(uv,p); else if(m==3) c=rings(uv,p); else c=nebula(uv,p);
  o=vec4(grade(c,uv),1.); }`;
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true });
function sh(t, s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x); if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
const prog=gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(prog); gl.useProgram(prog);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
window.render = (mode, seed, w, h) => { cv.width=w; cv.height=h; gl.viewport(0,0,w,h);
  gl.uniform2f(gl.getUniformLocation(prog,'uRes'),w,h); gl.uniform1f(gl.getUniformLocation(prog,'uMode'),mode); gl.uniform1f(gl.getUniformLocation(prog,'uSeed'),seed);
  gl.drawArrays(gl.TRIANGLES,0,3); return cv.toDataURL('image/png'); };
</script></body></html>
